[project]
name = "bafu-community-fixes"
version = "0.1.0"
description = "Community patches for the BAFU LCA database (EcoSpold 1 in, EcoSpold 1 out)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Chris Mutel", email = "cmutel@gmail.com" }
]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "platformdirs>=4.13.0",
    "pydantic>=2.14.1",
    "textual>=8.2.8",
]

[project.scripts]
bafu-fixes = "bafu_community_fixes.cli:main"
bafu-fixes-tui = "bafu_community_fixes.tui:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
venvPath = "."
venv = ".venv"
